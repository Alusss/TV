name: Build & Release

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: FongMi/TV
  UPSTREAM_BRANCH: fongmi
  MEDIA_REPO: FongMi/media
  MEDIA_BRANCH: release-1.11.0-fongmi

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout self
        uses: actions/checkout@v4

      - name: Get upstream latest commit
        id: upstream
        run: |
          SHA=$(curl -sL "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/commits/${{ env.UPSTREAM_BRANCH }}" \
            | jq -r '.sha')
          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "::error::Failed to fetch upstream commit"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream latest commit: $SHA"

      - name: Check if already built
        id: check
        run: |
          LAST_BODY=$(gh release view --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null || echo "")
          if echo "$LAST_BODY" | grep -q "${{ steps.upstream.outputs.sha }}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout upstream source
        if: steps.check.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_BRANCH }}
          path: source

      - name: Checkout FongMi/media
        if: steps.check.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MEDIA_REPO }}
          ref: ${{ env.MEDIA_BRANCH }}
          path: media

      - name: Set up JDK 21
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python 3.10
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Gradle dependencies
        if: steps.check.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('source/**/*.gradle*', 'source/gradle/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache media3 build
        if: steps.check.outputs.changed == 'true'
        id: cache-media
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/androidx/media3
          key: media3-${{ env.MEDIA_BRANCH }}-${{ hashFiles('media/libraries/**/build.gradle*', 'media/gradle/libs.versions.toml') }}
          restore-keys: |
            media3-${{ env.MEDIA_BRANCH }}-

      - name: Build media3 and publish to local Maven
        if: steps.check.outputs.changed == 'true' && steps.cache-media.outputs.cache-hit != 'true'
        run: |
          cd media
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon -x test -x lint \
            -x :libraries:ui_compose:assembleRelease \
            -x :libraries:ui_compose_material3:assembleRelease \
            -x :libraries:transformer:assembleRelease \
            -x :libraries:inspector:assembleRelease \
            -x :libraries:inspector_frame:assembleRelease
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Patch TV project
        if: steps.check.outputs.changed == 'true'
        run: |
          cd source

          # Add mavenLocal() to dependency repositories
          sed -i '/dependencyResolutionManagement/,/repositories {/{/repositories {/a\        mavenLocal()
          }' settings.gradle

          # Replace libs.media with media3 deps (no version - resolved from composite build / mavenLocal)
          sed -i 's|implementation libs.media|implementation libs.media\n    implementation "androidx.media3:media3-session"\n    implementation "androidx.media3:media3-ui"\n    implementation "androidx.media3:media3-mpvplayer"\n    implementation "androidx.media3:media3-ui-danmaku"|' app/build.gradle

          echo "=== settings.gradle repositories ==="
          grep -A8 'repositories {' settings.gradle
          echo "=== app/build.gradle media deps ==="
          grep -E 'media3|libs\.media' app/build.gradle

      - name: Decode keystore
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > source/app/release.jks

      - name: Create local.properties
        if: steps.check.outputs.changed == 'true'
        run: |
          cat > source/local.properties << EOF
          storeFile=release.jks
          keyAlias=${{ secrets.KEY_ALIAS }}
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APKs
        if: steps.check.outputs.changed == 'true'
        run: |
          cd source
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APKs
        if: steps.check.outputs.changed == 'true'
        id: collect
        run: |
          mkdir -p artifacts
          find source/app/build/outputs/apk -name '*.apk' -type f -exec cp {} artifacts/ \;
          ls -la artifacts/
          echo "apk_count=$(ls artifacts/*.apk 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check.outputs.changed == 'true' && steps.collect.outputs.apk_count != '0'
        run: |
          TAG=$(date -u +%Y%m%d)
          APK_LIST=""
          for apk in artifacts/*.apk; do
            APK_LIST="$APK_LIST $apk"
          done
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "FongMi TV $TAG" \
            --notes "Auto-built from ${{ env.UPSTREAM_REPO }} branch ${{ env.UPSTREAM_BRANCH }}

          Commit: ${{ steps.upstream.outputs.sha }}" \
            --latest \
            $APK_LIST
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: rm -f source/app/release.jks
