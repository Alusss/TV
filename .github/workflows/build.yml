name: Build & Release

on:
  schedule:
    - cron: '0 8 * * 1'  # 每周一 UTC 08:00
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: FongMi/TV
  UPSTREAM_BRANCH: fongmi

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout self
        uses: actions/checkout@v4

      - name: Get upstream latest commit
        id: upstream
        run: |
          SHA=$(curl -sL "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/commits/${{ env.UPSTREAM_BRANCH }}" \
            | jq -r '.sha')
          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "::error::Failed to fetch upstream commit"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream latest commit: $SHA"

      - name: Check if already built
        id: check
        run: |
          LAST_BODY=$(gh release view --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null || echo "")
          if echo "$LAST_BODY" | grep -q "${{ steps.upstream.outputs.sha }}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream commit ${{ steps.upstream.outputs.sha }} already built, skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New upstream commit detected, will build."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout upstream source
        if: steps.check.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_BRANCH }}
          path: source

      - name: Set up JDK 21
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode keystore
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > source/app/release.jks

      - name: Create local.properties
        if: steps.check.outputs.changed == 'true'
        run: |
          cat > source/local.properties << EOF
          storeFile=release.jks
          keyAlias=${{ secrets.KEY_ALIAS }}
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APKs
        if: steps.check.outputs.changed == 'true'
        run: |
          cd source
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APKs
        if: steps.check.outputs.changed == 'true'
        id: collect
        run: |
          mkdir -p artifacts
          find source/app/build/outputs/apk -name '*.apk' -type f -exec cp {} artifacts/ \;
          ls -la artifacts/
          echo "apk_count=$(ls artifacts/*.apk 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check.outputs.changed == 'true' && steps.collect.outputs.apk_count != '0'
        run: |
          TAG=$(date -u +%Y%m%d)
          APK_LIST=""
          for apk in artifacts/*.apk; do
            APK_LIST="$APK_LIST $apk"
          done

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "FongMi TV $TAG" \
            --notes "Auto-built from ${{ env.UPSTREAM_REPO }} branch ${{ env.UPSTREAM_BRANCH }}

          Commit: ${{ steps.upstream.outputs.sha }}" \
            --latest \
            $APK_LIST
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always()
        run: rm -f source/app/release.jks
