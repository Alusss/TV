name: Build & Release

on:
  schedule:
    - cron: '0 8 * * 1'
  push:                # 代码推送时触发
  workflow_dispatch:   # 允许手动触发


permissions:
  contents: write

env:
  UPSTREAM_REPO: FongMi/TV
  UPSTREAM_BRANCH: fongmi
  MEDIA_REPO: FongMi/media
  MEDIA_BRANCH: release-1.11.0-fongmi

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout self
        uses: actions/checkout@v4

      - name: Get upstream latest commit
        id: upstream
        run: |
          SHA=$(curl -sL "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/commits/${{ env.UPSTREAM_BRANCH }}" \
            | jq -r '.sha')
          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "::error::Failed to fetch upstream commit"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream latest commit: $SHA"

      - name: Check if already built
        id: check
        run: |
          LAST_BODY=$(gh release view --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null || echo "")
          if echo "$LAST_BODY" | grep -q "${{ steps.upstream.outputs.sha }}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout upstream source
        if: steps.check.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_BRANCH }}
          path: source

      - name: Checkout FongMi/media
        if: steps.check.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MEDIA_REPO }}
          ref: ${{ env.MEDIA_BRANCH }}
          path: media

      - name: Set up JDK 21
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python 3.10
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Gradle dependencies
        if: steps.check.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('source/**/*.gradle*', 'source/gradle/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache media3 build
        if: steps.check.outputs.changed == 'true'
        id: cache-media
        uses: actions/cache@v4
        with:
          path: /tmp/media3-aars
          key: media3-${{ env.MEDIA_BRANCH }}-${{ hashFiles('media/libraries/**/build.gradle*', 'media/gradle/libs.versions.toml') }}
          restore-keys: |
            media3-${{ env.MEDIA_BRANCH }}-

      - name: Build media3 and copy AARs
        if: steps.check.outputs.changed == 'true' && steps.cache-media.outputs.cache-hit != 'true'
        run: |
          cd media
          chmod +x gradlew
          # Build all modules TV project needs
          ./gradlew \
            :lib-common:assembleRelease \
            :lib-exoplayer:assembleRelease \
            :lib-session:assembleRelease \
            :lib-ui:assembleRelease \
            :lib-mpvplayer:assembleRelease \
            :lib-ui-danmaku:assembleRelease \
            :lib-datasource:assembleRelease \
            :lib-datasource-okhttp:assembleRelease \
            :lib-datasource-rtmp:assembleRelease \
            :lib-decoder:assembleRelease \
            :lib-effect:assembleRelease \
            :lib-extractor:assembleRelease \
            :lib-container:assembleRelease \
            :lib-database:assembleRelease \
            --no-daemon -x test -x lint 2>&1 | tail -30

          # Find and copy ALL AARs
          mkdir -p /tmp/media3-aars
          find libraries -path '*/buildout/outputs/aar/*.aar' -exec cp {} /tmp/media3-aars/ \;
          echo "Built AARs:"
          ls -la /tmp/media3-aars/
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Patch TV project
        if: steps.check.outputs.changed == 'true'
        run: |
          cd source

          # Copy ALL media3 AARs to app/libs (they use flatDir + fileTree)
          cp /tmp/media3-aars/*.aar app/libs/
          echo "=== Media3 AARs in app/libs ==="
          ls app/libs/*.aar

          # Add missing transitive deps for media3 AARs (fileTree doesn't resolve transitives)
          # These are needed by lib-session, lib-exoplayer, lib-ui-danmaku etc.
          sed -i '/implementation libs.media/a\
          implementation libs.annotation\n\
          implementation libs.okhttp\n\
          implementation libs.brotli\n\
          implementation libs.juniversalchardet\n\
          implementation libs.guava\n\
          implementation "androidx.collection:collection:1.5.0"\n\
          implementation "androidx.concurrent:concurrent-futures:1.2.0"\n\
          implementation "androidx.exifinterface:exifinterface:1.4.1"' app/build.gradle

          echo "=== app/build.gradle deps ==="
          grep -E 'media3|libs\.media|fileTree|guava|okhttp|brotli|juniversalchardet|annotation|collection|concurrent|exifinterface' app/build.gradle

      - name: Decode keystore
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > source/app/release.jks
          echo "Keystore size: $(wc -c < source/app/release.jks) bytes"

      - name: Create local.properties
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "storeFile=release.jks" > source/local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> source/local.properties
          echo "storePassword=${{ secrets.STOREPASS }}" >> source/local.properties
          echo "keyPassword=${{ secrets.KEYPASS }}" >> source/local.properties
          echo "=== local.properties ==="
          cat source/local.properties

      - name: Verify keystore
        if: steps.check.outputs.changed == 'true'
        run: |
          keytool -list -keystore source/app/release.jks \
            -storepass "${{ secrets.STOREPASS }}" \
            -alias "${{ secrets.KEY_ALIAS }}" || {
            echo "::error::Keystore verification failed. Check KEYSTORE_BASE64, STORE_PASSWORD, and KEY_ALIAS secrets."
            exit 1
          }

      - name: Build release APKs
        if: steps.check.outputs.changed == 'true'
        run: |
          cd source
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -80

      - name: Collect APKs
        if: steps.check.outputs.changed == 'true'
        id: collect
        run: |
          mkdir -p artifacts
          find source/app/build/outputs/apk -name '*.apk' -type f -exec cp {} artifacts/ \;
          ls -la artifacts/
          echo "apk_count=$(ls artifacts/*.apk 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check.outputs.changed == 'true' && steps.collect.outputs.apk_count != '0'
        run: |
          TAG=$(date -u +%Y%m%d)
          APK_LIST=""
          for apk in artifacts/*.apk; do
            APK_LIST="$APK_LIST $apk"
          done
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "FongMi TV $TAG" \
            --notes "Auto-built from ${{ env.UPSTREAM_REPO }} branch ${{ env.UPSTREAM_BRANCH }}

          Commit: ${{ steps.upstream.outputs.sha }}" \
            --latest \
            $APK_LIST
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: rm -f source/app/release.jks
